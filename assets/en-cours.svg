<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00FF99"/><stop offset="1" stop-color="#FF0066"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" fill-opacity=".03"/></pattern>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.r{animation:shim 2.4s ease-in-out infinite}
@keyframes shim{50%{opacity:.45}}
.glitch{animation:gl 4s steps(1) infinite}
@keyframes gl{0%,92%,100%{transform:none}93%{transform:translate(3px,-1px)}95%{transform:translate(-3px,1px)}97%{transform:translate(1px,0)}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.load{transform-origin:540px 0;animation:ld 3s ease-in-out infinite}
@keyframes ld{0%{transform:scaleX(.02)}60%{transform:scaleX(.12)}100%{transform:scaleX(.02)}}
</style>

<!-- Carte 1 : The AGI -->
<rect x="0" y="0" width="610" height="200" rx="18" fill="#0b0f17"/>
<rect x="0" y="0" width="610" height="200" rx="18" fill="url(#scan)"/>
<rect x=".5" y=".5" width="609" height="199" rx="17.5" fill="none" stroke="#1f2937"/>
<circle class="dot" cx="34" cy="36" r="5" fill="#00FF99"/>
<text x="48" y="41" font-size="13" fill="#00FF99" letter-spacing="1.5">EN COURS · JEU VIDÉO</text>
<text x="574" y="41" font-size="13" fill="#6b7280" text-anchor="end">🔒 privé</text>
<g class="glitch">
<text x="28" y="98" font-size="40" font-weight="700" fill="#FF0066" opacity=".55" transform="translate(2,0)">THE AGI</text>
<text x="28" y="98" font-size="40" font-weight="700" fill="#f3f4f6">THE AGI</text>
</g>
<rect class="r" x="28" y="122" width="210" height="12" rx="3" fill="#1f2937"/>
<rect class="r" x="248" y="122" width="120" height="12" rx="3" fill="#1f2937" style="animation-delay:.3s"/>
<rect class="r" x="378" y="122" width="160" height="12" rx="3" fill="#1f2937" style="animation-delay:.6s"/>
<rect class="r" x="28" y="142" width="140" height="12" rx="3" fill="#1f2937" style="animation-delay:.9s"/>
<rect class="r" x="178" y="142" width="230" height="12" rx="3" fill="#1f2937" style="animation-delay:1.2s"/>
<text x="28" y="182" font-size="12" fill="#6b7280">// détails classifiés jusqu'à nouvel ordre<tspan class="cur" fill="#00FF99">▍</tspan></text>

<!-- Carte 2 : jeu incrémental -->
<rect x="630" y="0" width="370" height="200" rx="18" fill="#0b0f17"/>
<rect x="630.5" y=".5" width="369" height="199" rx="17.5" fill="none" stroke="#1f2937" stroke-dasharray="6 6"/>
<circle class="dot" cx="660" cy="36" r="5" fill="#febc2e"/>
<text x="674" y="41" font-size="13" fill="#febc2e" letter-spacing="1.5">EN COURS · DÉBUT</text>
<text x="964" y="41" font-size="13" fill="#6b7280" text-anchor="end">🔒</text>
<text x="656" y="86" font-size="22" font-weight="700" fill="#f3f4f6">JEU INCRÉMENTAL</text>
<text x="656" y="110" font-size="13" fill="#9ca3af">Godot · Blender</text>
<text x="656" y="140" font-size="18" fill="#00FF99">+<tspan class="cnt">1</tspan> idée/s</text>
<rect x="660" y="156" width="310" height="6" rx="3" fill="#1f2937"/>
<rect class="load" x="660" y="156" width="310" height="6" rx="3" fill="url(#g)" style="transform-origin:660px 0"/>
<text x="660" y="188" font-size="12" fill="#6b7280">chargement…</text>
</svg>